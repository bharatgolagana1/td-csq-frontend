# nginx inside the csq-web container. Serves the Vite bundle from
# /usr/share/nginx/html on 8080 as the unprivileged nginx user; TLS and the
# public hostname are the host's nginx (td-csq-backend/deploy/nginx/csq.conf).
#
# /etc/nginx/csq-headers.conf is rendered at image build by
# deploy/render-headers.mjs (CSP with the API and Keycloak origins and the
# hash of the inline theme script). nginx discards every inherited add_header
# the moment a location declares one of its own, so it is included in each
# location that sets any header.
worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    # woff2 is already compressed; images are not part of this bundle

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/csq-headers.conf;

        # Vite content-hashes everything under /assets/, so a changed file
        # always has a new name: cache forever. A name that does not exist
        # is a 404, never the SPA fallback, so a stale index.html fails
        # loudly instead of executing HTML as a script.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/csq-headers.conf;
            access_log off;
            try_files $uri =404;
        }

        # index.html is what points the browser at the current asset names.
        # no-cache (not no-store) lets the browser revalidate with the ETag
        # and get a cheap 304 when nothing changed. Deep links land here too:
        # try_files below redirects internally and this block's headers apply.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            include /etc/nginx/csq-headers.conf;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # SPA: every route the bundle knows (/cycles/…, /assess/:token, …)
        # is served index.html and resolved client-side.
        location / {
            try_files $uri /index.html;
        }
    }
}
