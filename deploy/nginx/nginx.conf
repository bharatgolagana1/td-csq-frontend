# nginx inside the csq-web container. Serves the Vite bundle (built with
# VITE_BASE_PATH=/app/) under /app/ on 8080 as the unprivileged nginx user.
# TLS and the public hostname are the host's nginx, which proxies only /app/
# here and keeps / for the landing site and /api/ for the API
# (td-csq-backend/deploy/nginx/csq-single-host.conf).
#
# The Dockerfile copies dist/ to /usr/share/nginx/html/app, so with
# root = /usr/share/nginx/html every /app/… URI maps straight to a file and
# no `alias` (with its try_files quirks) is needed.
#
# /etc/nginx/csq-headers.conf is rendered at image build by
# deploy/render-headers.mjs (CSP with the API and Keycloak origins and the
# hash of the inline theme script). nginx discards every inherited add_header
# the moment a location declares one of its own, so it is included in each
# location that sets any header.
worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    # woff2 is already compressed; images are not part of this bundle

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Redirects carry a path, not http://<container>/…, so the browser
        # stays on the public https origin when they pass through the proxy.
        absolute_redirect off;

        include /etc/nginx/csq-headers.conf;

        # Docker's HEALTHCHECK (direct to the container) and the same answer
        # under the base path, which is what the host proxy can reach.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /app/healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite content-hashes everything under /app/assets/, so a changed
        # file always has a new name: cache forever. A name that does not
        # exist is a 404, never the SPA fallback, so a stale index.html
        # fails loudly instead of executing HTML as a script.
        location /app/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/csq-headers.conf;
            access_log off;
            try_files $uri =404;
        }

        # index.html is what points the browser at the current asset names.
        # no-cache (not no-store) lets the browser revalidate with the ETag
        # and get a cheap 304 when nothing changed. Deep links land here too:
        # try_files below redirects internally and this block's headers apply.
        location = /app/index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            include /etc/nginx/csq-headers.conf;
        }

        # /app (no slash) is what a typed URL or an e-mail footer looks like.
        location = /app {
            return 301 /app/;
        }

        # SPA: every route the bundle knows (/app/cycles/…, /app/assess/:token,
        # …) is served index.html and resolved client-side by the router,
        # whose basename is /app.
        location /app/ {
            try_files $uri /app/index.html;
        }

        # Everything outside /app/ belongs to the host nginx (landing, API).
        # A 404 here means a proxy rule is wrong, not that the app is down.
        location / {
            return 404;
        }
    }
}
