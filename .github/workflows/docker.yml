# Builds the web image (served under /app) on every push to main and
# publishes it to GitHub's registry, so a deployment only pulls. The build-time
# values are the production ones: the API is same-origin under /api, identity
# is the hosted Keycloak realm.
name: docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_BASE_PATH=/app/
            VITE_API_BASE_URL=/api/v1
            VITE_KEYCLOAK_URL=https://auth.tinydata.in/
            VITE_KEYCLOAK_REALM=csq
            VITE_KEYCLOAK_CLIENT_ID=csq-frontend
          tags: |
            ghcr.io/${{ github.repository_owner }}/csq-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/csq-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
