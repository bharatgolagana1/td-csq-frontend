# Static site for dev.csq.aero. No application, no upstream, no secrets.
worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # nginx 1.27's own mime.types already maps avif and webp

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    # images are already AVIF/WebP/JPEG: compressing them again only burns CPU

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # Asset filenames carry their width (nose-1440.avif), so a replaced image
        # must get a new name. Nothing here is content-hashed by a bundler.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
            access_log off;
            try_files $uri =404;
        }

        # index.html must never be cached. It is what points the browser at the
        # current asset filenames; a stale copy pins visitors to old images
        # indefinitely after a redeploy.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
